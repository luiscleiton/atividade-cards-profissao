<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Formulário -->
    <div class="formulario">

        <input
            type="text"
            id="nome"
            placeholder="Nome"
        >

        <input
            type="text"
            id="profissao"
            placeholder="Profissão"
        >

        <input
            type="file"
            id="imagem"
            accept="image/*"
        >

        <button onclick="cadastrar()">
            Cadastrar
        </button>

    </div>


    <!-- Cards -->
    <div id="cards"></div>


    <script>

        function cadastrar() {

            const nome = document.getElementById("nome").value;
            const profissao = document.getElementById("profissao").value;
            const imagem = document.getElementById("imagem").files[0];


            // Verifica se todos os campos foram preenchidos
            if (!nome || !profissao || !imagem) {
                return;
            }


            // Cria o card
            const card = document.createElement("div");
            card.className = "card";


            // Nome
            const nomeTexto = document.createElement("div");
            nomeTexto.className = "nome";
            nomeTexto.textContent = nome;


            // Imagem
            const foto = document.createElement("img");
            foto.className = "foto";
            foto.src = URL.createObjectURL(imagem);


            // Profissão
            const profissaoTexto = document.createElement("div");
            profissaoTexto.className = "profissao";
            profissaoTexto.textContent = profissao;


            // Coloca tudo dentro do card
            card.appendChild(nomeTexto);
            card.appendChild(foto);
            card.appendChild(profissaoTexto);


            // Adiciona o card na página
            document.getElementById("cards").appendChild(card);


            // Limpa os campos
            document.getElementById("nome").value = "";
            document.getElementById("profissao").value = "";
            document.getElementById("imagem").value = "";
        }

    </script>

</body>

</html>
